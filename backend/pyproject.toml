[project]
name = "rag-knowledge-assistant"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "agent-detector",
    "gradio",
    "python-multipart",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "pinecone",
    "langchain-core",
    "langchain",
    "langchain-tavily",
]

[tool.fastapi]
entrypoint = "app.main:app"
